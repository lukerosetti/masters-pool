<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00205B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PGA Championship" />
    <meta name="description" content="PGA Championship Pool 2026 — Pick your golfers, track the leaderboard, win the pool." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <title>PGA Championship Pool 2026</title>
    <style>
      #splash { position:fixed; inset:0; background:#00205B; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.3s; }
      #splash.hide { opacity:0; pointer-events:none; }
      #splash .logo { width:60px; height:60px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
      #splash .logo svg { width:60px; height:60px; }
      #splash p { color:rgba(198,163,78,0.8); font-size:13px; font-family:'DM Sans',sans-serif; letter-spacing:1px; }
    </style>
  </head>
  <body>
    <div id="splash"><div class="logo"><svg viewBox="0 0 120 120"><path d="M48 30 L72 30 L70 55 Q68 70 60 75 Q52 70 50 55 Z" fill="none" stroke="#C6A34E" stroke-width="1.5"/><line x1="60" y1="75" x2="60" y2="88" stroke="#C6A34E" stroke-width="1.5"/><line x1="48" y1="88" x2="72" y2="88" stroke="#C6A34E" stroke-width="1.5"/><path d="M48 38 Q35 40 35 50 Q35 58 46 55" fill="none" stroke="rgba(198,163,78,0.4)" stroke-width="1"/><path d="M72 38 Q85 40 85 50 Q85 58 74 55" fill="none" stroke="rgba(198,163,78,0.4)" stroke-width="1"/></svg></div><p>PGA Championship 2026</p></div>
    <div id="root"></div>
    <script>
      // Hide splash when React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) { s.classList.add('hide'); setTimeout(function() { s.remove(); }, 300); }
        }, 500);
      });
    </script>
  </body>
</html>
